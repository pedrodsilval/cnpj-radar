name: Teste diagnóstico — IP datacenter x portal FGTS/Caixa

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: IP público do runner
        run: curl -s https://api.ipify.org; echo

      - name: Reputação do IP (ipapi)
        run: curl -s "https://ipapi.co/$(curl -s https://api.ipify.org)/json/" || true

      - name: Requisição direta ao portal FGTS/CRF (curl simples)
        run: |
          curl -s -D headers.txt -o body.html -w "\nHTTP_CODE:%{http_code}\nTIME:%{time_total}\n" \
            "https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "--- HEADERS ---"
          cat headers.txt
          echo "--- BODY (primeiros 3000 chars) ---"
          head -c 3000 body.html
          echo
          echo "--- BODY contém o form real (mainForm)? ---"
          grep -o "mainForm" body.html | head -1 || echo "NAO ENCONTRADO"
          echo "--- BODY contém sinal de bloqueio/erro? ---"
          grep -oiE "acesso negado|bloqueado|forbidden|access denied|erro interno|indisponível" body.html || echo "nenhum termo de bloqueio encontrado no texto"

      - name: Instala Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Teste real com navegador (Playwright headless)
        run: |
          cat <<'EOF' > teste.js
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              locale: 'pt-BR',
            });
            try {
              await page.goto('https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf', { waitUntil: 'networkidle', timeout: 30000 });
              const titulo = await page.title();
              const url = page.url();
              const campoExiste = await page.locator('[id*="numInscricao"], [id*="Inscricao"], input[type="text"]').count();
              const corpo = (await page.evaluate(() => document.body.innerText) || '').slice(0, 1500);
              console.log('TITULO:', titulo);
              console.log('URL_FINAL:', url);
              console.log('CAMPOS_TEXT_INPUT_ENCONTRADOS:', campoExiste);
              console.log('--- CORPO DA PAGINA (ate 1500 chars) ---');
              console.log(corpo);
            } catch (err) {
              console.log('ERRO:', String(err));
            } finally {
              await browser.close();
            }
          })();
          EOF
          node teste.js
