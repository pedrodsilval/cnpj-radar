name: Keepalive

# Pinga o health check do backend para gerar atividade no banco e evitar a pausa
# automática do Supabase free tier (~7 dias sem queries). O /health executa um
# SELECT 1, então o ping conta como atividade real. Também acorda o Render (hiberna
# após ~15 min). 2x/dia com folga contra atrasos do agendador do GitHub Actions.
#
# Observação: o GitHub desativa workflows agendados após ~60 dias SEM commits no
# repositório. Se o projeto ficar parado, reative em Actions ou faça um commit.

on:
  schedule:
    - cron: '37 5,17 * * *'   # 05:37 e 17:37 UTC (02:37 e 14:37 BRT) — desencontrado do painel
  workflow_dispatch:           # permite disparar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (com retry p/ cold start do Render)
        run: |
          URL="https://cnpj-radar.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "banco ativo — keepalive ok"
              exit 0
            fi
            sleep 30
          done
          echo "health check nao respondeu 200 apos 6 tentativas"
          exit 1
